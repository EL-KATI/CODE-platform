<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>غير متصل — CODE</title>
  <meta name="theme-color" content="#ea580c">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Tajawal, 'Segoe UI', system-ui, sans-serif;
      background: #0c0a09;
      color: #e7e5e4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      opacity: .7;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ea580c;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      color: #a8a29e;
      line-height: 1.7;
      max-width: 320px;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
    }

    .btn:hover { background: #c2410c; }

    .tip {
      margin-top: 32px;
      font-size: 13px;
      color: #57534e;
    }

    .tip strong { color: #78716c; }
  </style>
</head>
<body>
  <div class="icon">📶</div>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>
    تحقق من اتصالك بالإنترنت ثم حاول مجدداً.<br>
    بعض الصفحات قد تكون متاحة من الكاش.
  </p>
  <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
  <p class="tip">
    <strong>نصيحة:</strong> ثبّت التطبيق على هاتفك للوصول إليه في أي وقت.
  </p>

  <script>
    // إعادة التوجيه عند استعادة الاتصال
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
